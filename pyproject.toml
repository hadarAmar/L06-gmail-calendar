[project]
name = "l06"
version = "0.1.0"
description = "Gmail and Google Calendar MCP server (stdio via FastMCP)"
requires-python = ">=3.15"
dependencies = [
    "google-api-python-client>=2.202.0",
    "google-auth-oauthlib>=1.5.0",
    "mcp>=1.2,<2",
]

[project.scripts]
gmail-calendar = "l06.server:main"
l06 = "l06:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"
